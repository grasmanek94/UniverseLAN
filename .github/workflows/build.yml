name: Build UniverseLAN

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and package
        shell: cmd
        run: z-compile+release-gh.bat

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release-packages/*.zip