name: Build UniverseLAN

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and package
        shell: cmd
        run: z-compile+release-gh.bat


      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $count = git rev-list --count HEAD
          "tag=$count" >> $env:GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Build ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: true
          files: |
            release-packages/*.zip
          body: |
            ## UniverseLAN
            
            Automated build release.
            
            See the automatically generated changelog below.